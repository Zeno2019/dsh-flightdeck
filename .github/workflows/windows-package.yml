name: Windows package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Package Windows x64 NSIS
        run: npm run package:win
      - name: Smoke unpacked and installed applications
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $diagnosticsDirectory = Join-Path $env:RUNNER_TEMP "dsh-flightdeck-diagnostics"
          New-Item -ItemType Directory -Path $diagnosticsDirectory -Force | Out-Null

          function Invoke-PackagedSmoke {
            param(
              [Parameter(Mandatory)] [string] $Name,
              [Parameter(Mandatory)] [string] $ExecutablePath
            )

            $baselineNodePids = @(
              Get-Process -Name "node" -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty Id
            )
            $logDirectory = Join-Path $env:APPDATA "DSH Flightdeck\logs"
            $logFile = Join-Path $logDirectory "harness.log"
            Remove-Item -Path $logDirectory -Recurse -Force -ErrorAction SilentlyContinue

            $appProcess = $null
            try {
              $resolvedExecutable = (Resolve-Path $ExecutablePath).Path
              $appProcess = Start-Process `
                -FilePath $resolvedExecutable `
                -WorkingDirectory (Split-Path $resolvedExecutable) `
                -PassThru

              $endpointMarker = "[desktop] endpoint http://127.0.0.1:"
              $endpointPattern = "(?m)^$([regex]::Escape($endpointMarker))(?<port>[0-9]+)\r?$"
              $fatalPattern = "(?im)(?:^|\W)(?:fatal|uncaught(?:\s+)?exception|unhandled(?:\s+)?rejection)(?:\W|$)"
              $deadline = (Get-Date).AddSeconds(180)
              $readyResponse = $null
              $lastProbeFailure = "endpoint marker not found"

              while ((Get-Date) -lt $deadline) {
                if (Test-Path $logFile) {
                  $logContent = Get-Content -Path $logFile -Raw
                  if ([regex]::IsMatch($logContent, $fatalPattern)) {
                    throw "$Name log contains a fatal marker"
                  }
                  $endpointMatch = [regex]::Match($logContent, $endpointPattern)
                  if ($endpointMatch.Success) {
                    $endpoint = "http://127.0.0.1:$($endpointMatch.Groups['port'].Value)"
                    try {
                      $candidateResponse = Invoke-WebRequest -Uri $endpoint -Method Get -TimeoutSec 10 -ErrorAction Stop
                      if ($candidateResponse.StatusCode -ge 200 -and $candidateResponse.StatusCode -lt 300) {
                        $readyResponse = $candidateResponse
                        break
                      }
                      $lastProbeFailure = "HTTP $($candidateResponse.StatusCode) from $endpoint"
                    } catch {
                      $lastProbeFailure = $_.Exception.Message
                    }
                  }
                }
                if ($appProcess.HasExited) {
                  throw "$Name exited before readiness with code $($appProcess.ExitCode)"
                }
                Start-Sleep -Seconds 2
              }

              if ($null -eq $readyResponse) {
                throw "$Name did not reach HTTP 2xx within 180s: $lastProbeFailure"
              }
              $finalLogContent = Get-Content -Path $logFile -Raw
              if ([regex]::IsMatch($finalLogContent, $fatalPattern)) {
                throw "$Name log contains a fatal marker"
              }
            } finally {
              if ($null -ne $appProcess -and -not $appProcess.HasExited) {
                [void] $appProcess.CloseMainWindow()
                if (-not $appProcess.WaitForExit(10000)) {
                  & taskkill.exe /PID $appProcess.Id /T /F | Out-Null
                  if (-not $appProcess.WaitForExit(10000)) {
                    throw "$Name process tree did not stop"
                  }
                }
              }

              if (Test-Path $logFile) {
                Copy-Item -Path $logFile -Destination (Join-Path $diagnosticsDirectory "$Name-harness.log") -Force
              }

              $remainingNewNodePids = @(
                Get-Process -Name "node" -ErrorAction SilentlyContinue |
                  Where-Object { $_.Id -notin $baselineNodePids } |
                  Select-Object -ExpandProperty Id
              )
              if ($remainingNewNodePids.Count -gt 0) {
                foreach ($nodePid in $remainingNewNodePids) {
                  & taskkill.exe /PID $nodePid /T /F | Out-Null
                }
                throw "$Name left new node.exe PIDs: $($remainingNewNodePids -join ', ')"
              }
            }
          }

          Write-Host "::notice::Reduced smoke gate: HTTP 2xx readiness only; keyless DSH RPC is not exercised."
          Invoke-PackagedSmoke -Name "win-unpacked" -ExecutablePath "dist/win-unpacked/DSH Flightdeck.exe"

          $setupExecutables = @(Get-ChildItem -Path "dist" -Filter "*-setup.exe" -File)
          if ($setupExecutables.Count -ne 1) {
            throw "expected exactly one setup executable, found $($setupExecutables.Count)"
          }
          $setupExecutable = $setupExecutables[0]
          if ($null -eq $setupExecutable) {
            throw "setup executable selection failed"
          }
          $installDirectory = Join-Path $env:RUNNER_TEMP "dsh-flightdeck-installed"
          Remove-Item -Path $installDirectory -Recurse -Force -ErrorAction SilentlyContinue
          $installerArguments = @("/S", "/D=$installDirectory")
          $installerProcess = Start-Process `
            -FilePath $setupExecutable.FullName `
            -ArgumentList $installerArguments `
            -Wait `
            -PassThru
          if ($installerProcess.ExitCode -ne 0) {
            throw "silent setup failed with code $($installerProcess.ExitCode)"
          }

          $installedExecutable = Join-Path $installDirectory "DSH Flightdeck.exe"
          Invoke-PackagedSmoke -Name "installed" -ExecutablePath $installedExecutable
      - name: Upload unsigned NSIS setup
        uses: actions/upload-artifact@v4
        with:
          name: dsh-flightdeck-windows-x64-nsis
          path: dist/dsh-flightdeck-windows-x64-setup.exe
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-flightdeck-windows-diagnostics
          path: |
            ${{ runner.temp }}/dsh-flightdeck-diagnostics/*.log
            dist/builder-debug.yml
            dist/builder-effective-config.yaml
          if-no-files-found: warn
